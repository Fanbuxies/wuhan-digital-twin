services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: twin-pg
    environment:
      POSTGRES_DB: twin
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"      # 改成 5434，避开 5432(本机PG) 和 5433(model-standard-postgres)
    volumes:
      - ./pgdata:/var/lib/postgresql/data
