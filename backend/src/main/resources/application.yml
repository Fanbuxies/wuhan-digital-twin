server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: twin-backend
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  # mapper xml 统一放 resources/mapper 下，当前尚无业务 mapper
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    # 数据库下划线字段自动映射为驼峰属性，如 height_source -> heightSource
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 主键由数据库 bigserial 生成
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  tileset:
    # 相对路径，由前端 Vite 从 public/tiles/ 同源静态托管；
    # 留空则 tileset-info 返回 null，前端走 GeoJSON 降级
    url: /tiles/tileset.json
    # 相机位置是视点而非注视点，视线落在其正北约 height/tan(|pitch|) 处，
    # 故视点压到 bbox 南侧，斜俯视才能框住全域
    camera:
      lon: 114.3140
      lat: 30.5320
      height: 4200
      heading: 0
      pitch: -40
  building:
    # GeoJSON 单次返回要素上限，当前全域 5303 栋，留足余量；
    # 上限继续抬高会让单次响应超过 10 MB，届时应改走 3D Tiles 而非再调此值
    geojson-max-features: 12000
  simulator:
    # 关闭后不注册调度线程，实时表停止刷新但接口仍可读历史值
    enabled: true
    # 调度周期，单位毫秒，与 docs 约定的 3 秒推送节奏一致
    fixed-rate: 3000
    # 单设备单次调度的告警概率，约 650 台在线设备约每分钟 26 条
    alarm-probability: 0.002
    # 每 5 次调度（15 秒）落一批历史遥测
    telemetry-tick-interval: 5
    # 市政设施调度周期，比设备慢一倍，设施数量更多但变化更缓
    facility-fixed-rate: 6000
    # 单设施单次调度的告警概率，室外设施故障率低于楼内设备
    facility-alarm-probability: 0.001
